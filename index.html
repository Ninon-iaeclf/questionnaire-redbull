<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Étude boisson énergisante</title>
<style>
  :root {
    --bg: #f4f6fb; --card: #ffffff; --text: #1c2233; --muted: #5d6680;
    --accent: #1e3a8a; --accent-2: #b3122e; --border: #d9deea; --ok: #e8f0ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
  h1 { font-size: 1.35rem; margin: 0 0 12px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: .92rem; }
  .progress { height: 6px; background: var(--border); border-radius: 3px; margin-bottom: 16px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .q { margin: 20px 0; }
  .q > label.title, .q > .title { display: block; font-weight: 600; margin-bottom: 8px; }
  .opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--border);
         border-radius: 10px; margin-bottom: 8px; cursor: pointer; }
  .opt:has(input:checked) { background: var(--ok); border-color: var(--accent); }
  .opt input { margin-top: 4px; }
  .field { display: flex; align-items: center; gap: 8px; }
  .field input { width: 120px; padding: 10px; font-size: 1rem; border: 1px solid var(--border); border-radius: 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row .opt { flex: 1 1 120px; margin-bottom: 0; }
  .gg { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0;
        border-bottom: 1px solid var(--border); }
  .gg strong { min-width: 70px; }
  .gg .row .opt { flex: 0 0 auto; }
  .likert { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .likert .opt { flex-direction: column; align-items: center; text-align: center; font-size: .78rem; padding: 8px 4px; margin: 0; }
  .likert .opt input { margin: 0; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 12px 22px;
           font-size: 1rem; cursor: pointer; margin-top: 12px; }
  .error { color: var(--accent-2); font-size: .92rem; margin-top: 8px; min-height: 1.2em; }
  .warn { background: #fff6e0; border: 1px solid #f0c674; border-radius: 10px; padding: 12px; margin-top: 12px; }

  /* La présentation de l'offre : la bande d'icônes du bas de l'affiche est masquée */
  .offer { margin: 8px 0 16px; }
  .visual { aspect-ratio: 673 / 870; overflow: hidden; border-radius: 12px; max-width: 360px; margin: 0 auto 12px; }
  .visual img { width: 100%; display: block; }
  .offer ul { margin: 0; padding-left: 18px; }
  .limited { background: var(--accent-2); color: #fff; border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; text-align: center; }
  .limited strong { display: block; letter-spacing: .06em; }
  @media (max-width: 480px) {
    .gg { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<main>
  <div class="progress"><div id="bar"></div></div>
  <div class="card" id="app"></div>
  <p class="muted" style="text-align:center;margin-top:16px">
    Étude universitaire — M1 Marketing, IAE Clermont Auvergne. Non affiliée à la marque Red Bull.
  </p>
</main>

<script>
/* ============ À MODIFIER ============ */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbwlNLkGrs3qWfcl9JCGWRdgwTL-5FesFIFFfp4D6ecDnkA0w4U19MPGRESTkUOx7nTT/exec";
// Prix proposés dans Gabor-Granger, du plus cher au moins cher (même ordre pour tous)
const GG_PRICES = [1.80, 1.70, 1.60, 1.45, 1.30, 1.15];
/* ==================================== */

const fmt = p => p.toFixed(2).replace(".", ",") + " €";
const ggKey = p => "gg_" + p.toFixed(2).replace(".", "_");

// --- Tirage au sort A/B, fait à l'ouverture, gardé si la page est rechargée ---
const params = new URLSearchParams(location.search);
let version = params.get("v");               // ?v=A ou ?v=B pour tester une version précise
const isTest = version === "A" || version === "B";
if (!isTest) {
  try { version = sessionStorage.getItem("version"); } catch (e) {}
  if (version !== "A" && version !== "B") {
    version = Math.random() < 0.5 ? "A" : "B";
    try { sessionStorage.setItem("version", version); } catch (e) {}
  }
}

const data = {
  id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()).slice(0, 8),
  format: 5, version, test: isTest ? 1 : 0, statut: "en_cours",
};
const start = Date.now();

// --- L'offre : A et B identiques, sauf le bandeau « édition limitée » ---
function offerHtml() {
  const limited = version === "A"
    ? `<div class="limited"><strong>ÉDITION LIMITÉE</strong>Disponible uniquement cet hiver, en quantité limitée.</div>`
    : "";
  return `<div class="offer">
      <div class="visual"><img src="canette.jpg" alt="Canette Red Bull Winter Edition Sugarfree, goût pomme d'amour"></div>
      ${limited}
      <p><strong>Red Bull Winter Edition Sugarfree, goût pomme d'amour</strong></p>
      <ul>
        <li>Canette de 25 cl</li>
        <li>Sans sucres</li>
        <li>Goût pomme d'amour : pomme rouge et caramel</li>
        <li>Même teneur en caféine qu'une Red Bull classique</li>
      </ul>
    </div>`;
}

// --- Petits constructeurs de questions ---
const radios = (name, opts, cls = "") => `<div class="${cls}">` + opts.map(([v, l]) =>
  `<label class="opt"><input type="radio" name="${name}" value="${v}"><span>${l}</span></label>`).join("") + "</div>";
const field = (name, label, unit) => `<div class="q"><label class="title" for="${name}">${label}</label>
  <div class="field"><input id="${name}" name="${name}" type="text" inputmode="decimal" autocomplete="off"> ${unit}</div></div>`;
const LIKERT = [["1","Pas du tout d'accord"],["2","Plutôt pas d'accord"],["3","Ni d'accord ni pas d'accord"],["4","Plutôt d'accord"],["5","Tout à fait d'accord"]];
const likert = (name, label) => `<div class="q"><span class="title">${label}</span>${radios(name, LIKERT, "likert")}</div>`;

const val = n => { const el = document.querySelector(`input[name="${n}"]:checked`); return el ? el.value : null; };
const num = n => { const s = document.querySelector(`input[name="${n}"]`).value.trim().replace(",", ".").replace("€", "");
  const x = Number(s); return s === "" || isNaN(x) ? null : x; };

const GG_SCALE = [["1","Certainement pas"],["2","Probablement pas"],["3","Peut-être"],["4","Probablement oui"],["5","Certainement oui"]];
const VW = ["vw_trop_bon_marche", "vw_bon_marche", "vw_cher", "vw_trop_cher"];
// Échelles de Likert, 3 items par concept
// Page 1 : concepts du Marketing Scales Handbook vol. 10 (Bruner 2019), items adaptés en français
const LK_PAGE_1 = [
  ["rar_1", "Cette boisson ne sera disponible que pendant une courte période."],                       // Product Scarcity (p. 342)
  ["rar_2", "Cette boisson risque d'être difficile à trouver."],
  ["rar_3", "Cette boisson risque d'être rapidement épuisée."],
  ["pf_1", "Payer plus cher pour cette boisson me paraîtrait justifié."],                              // Price Fairness (p. 315)
  ["pf_2", "Un prix plus élevé que celui d'une Red Bull classique serait raisonnable pour cette boisson."],
  ["pf_3", "Je trouverais normal que cette boisson coûte plus cher."],
  ["ant_1", "J'ai hâte de goûter cette boisson."],                                                     // Anticipation (Affective) (p. 8)
  ["ant_2", "L'idée de goûter cette boisson me rend curieux(se)."],
  ["ant_3", "Je serais excité(e) de l'essayer dès sa sortie."],
];
// Page 2 : adaptées de Dodds, Monroe & Grewal (1991)
const LK_PAGE_2 = [
  ["val_1", "Pour ce qu'elle offre, cette boisson vaut son prix."],                // valeur perçue
  ["val_2", "Acheter cette boisson serait une bonne affaire."],
  ["val_3", "Ce que j'obtiens avec cette boisson vaut ce que je paierais."],
  ["qual_1", "Cette boisson me paraît de bonne qualité."],                          // qualité perçue (1 item)
  ["int_1", "Je serais prêt(e) à acheter cette boisson."],                          // intention d'achat
  ["int_2", "Il est probable que j'achète cette boisson."],
  ["int_3", "J'envisagerais d'acheter cette boisson."],
];
const likertPage = (title, items) => ({
  html: () => `<h2>${title}</h2>
    <p>Indiquez dans quelle mesure vous êtes d'accord avec chaque phrase.</p>
    ${items.map(([n, l]) => likert(n, l)).join("")}`,
  check: () => items.every(([n]) => val(n)) ? null : "Merci de répondre à chaque phrase.",
  save: () => { items.forEach(([n]) => data[n] = Number(val(n))); },
});

// --- Les étapes du questionnaire ---
let vwWarned = false;
const steps = [
  { // 1. Accueil
    html: () => `<h1>Votre avis sur une nouvelle boisson énergisante</h1>
      <p>Dans le cadre d'un projet de Master 1 Marketing à l'IAE Clermont Auvergne, nous étudions l'avis des
      consommateurs sur une nouvelle boisson énergisante.</p>
      <p>Le questionnaire prend environ <strong>5 minutes</strong>. Il est <strong>anonyme</strong> : nous ne
      demandons ni nom, ni adresse e-mail. Les réponses servent uniquement à ce projet d'étude.</p>
      <div class="q">${radios("consent", [["oui", "J'accepte de participer"], ["non", "Je ne souhaite pas participer"]])}</div>`,
    check: () => val("consent") ? null : "Merci de choisir une réponse.",
    save: () => { data.consent = val("consent"); return data.consent === "oui" ? null : "refus"; },
  },
  { // 2. Profil : âge (bloque les moins de 18 ans), sexe, situation, lieu de résidence
    html: () => `<h2>Pour commencer, quelques questions sur vous</h2>
      ${field("age", "Quel âge avez-vous ?", "ans")}
      <div class="q"><span class="title">Vous êtes</span>${radios("genre", [["femme","Une femme"],["homme","Un homme"],["autre","Autre / je préfère ne pas répondre"]])}</div>
      <div class="q"><span class="title">Votre situation actuelle</span>
      ${radios("situation", [["lyceen","Lycéen(ne)"],["etudiant","Étudiant(e)"],["alternant","Étudiant(e) en alternance"],
        ["salarie","Salarié(e)"],["independant","Indépendant(e), auto-entrepreneur(se)"],["recherche","En recherche d'emploi"],
        ["sans_activite","Sans activité professionnelle"],["retraite","Retraité(e)"],["autre","Autre"]])}</div>
      <div class="q"><span class="title">Vous habitez :</span>
      ${radios("residence", [["grande_ville","Dans une grande ville (plus de 100 000 habitants)"],["ville_moyenne","Dans une ville moyenne (de 20 000 à 100 000 habitants)"],
        ["petite_ville","Dans une petite ville (de 2 000 à 20 000 habitants)"],["campagne","À la campagne ou dans un village (moins de 2 000 habitants)"]])}</div>`,
    check: () => {
      const a = num("age");
      if (a === null || !Number.isInteger(a) || a < 10 || a > 99) return "Merci d'indiquer votre âge en chiffres (ex : 21).";
      return ["genre", "situation", "residence"].every(val) ? null : "Merci de répondre à chaque question.";
    },
    save: () => { data.age = num("age");
      if (data.age < 18) return "mineur";
      ["genre", "situation", "residence"].forEach(k => data[k] = val(k)); },
  },
  { // 2 bis. Habitudes : fréquence Red Bull et lieu d'achat (variables de contrôle)
    html: () => `<h2>Vos habitudes</h2>
      <div class="q"><span class="title">À quelle fréquence buvez-vous du Red Bull ?</span>
      ${radios("frequence_redbull", [["jamais","Jamais"],["<1/mois","Moins d'une fois par mois"],["1-3/mois","1 à 3 fois par mois"],["1-3/sem","1 à 3 fois par semaine"],["4+/sem","4 fois par semaine ou plus"]])}</div>
      <div class="q"><span class="title">Où achetez-vous le plus souvent vos boissons énergisantes ?</span>
      ${radios("lieu_achat", [["supermarche","En supermarché ou hypermarché"],["proximite","En supérette, épicerie de proximité ou épicerie de nuit"],
        ["station","En station-service"],["distributeur","Dans un distributeur automatique"],["bar","Dans un bar, une boîte de nuit ou un restaurant"],
        ["en_ligne","En ligne"],["aucun","Je n'en achète pas"]])}</div>`,
    check: () => ["frequence_redbull", "lieu_achat"].every(val) ? null : "Merci de répondre à chaque question.",
    save: () => { ["frequence_redbull", "lieu_achat"].forEach(k => data[k] = val(k)); },
  },
  { // 3 + 4a. Offre + Van Westendorp
    html: () => `<h2>Découvrez cette boisson</h2>
      <p class="muted">Regardez attentivement la présentation. Elle reste affichée pendant les questions.</p>
      ${offerHtml()}
      <p>Pour cette canette de 25 cl, indiquez un prix en euros :</p>
      ${field("vw_trop_bon_marche", "À quel prix la trouveriez-vous <u>si bon marché</u> que vous douteriez de sa qualité et ne l'achèteriez pas ?", "€")}
      ${field("vw_bon_marche", "À quel prix la trouveriez-vous <u>bon marché</u>, une bonne affaire ?", "€")}
      ${field("vw_cher", "À quel prix commenceriez-vous à la trouver <u>chère</u>, tout en envisageant quand même de l'acheter ?", "€")}
      ${field("vw_trop_cher", "À quel prix la trouveriez-vous <u>trop chère</u> pour envisager de l'acheter ?", "€")}
      <div id="vwwarn"></div>`,
    check: () => {
      const v = VW.map(num);
      if (v.some(x => x === null)) return "Merci d'indiquer un prix en euros pour chaque question.";
      if (v.some(x => x < 0 || x > 50)) return "Merci d'indiquer un prix réaliste en euros.";
      const ordered = v.every((x, i) => i === 0 || x >= v[i - 1]);
      if (!ordered && !vwWarned) {
        vwWarned = true;
        document.getElementById("vwwarn").innerHTML = `<div class="warn">Vos prix ne vont pas du moins cher au plus cher.
          Vérifiez vos réponses, ou cliquez à nouveau sur « Suivant » pour les garder telles quelles.</div>`;
        return "";
      }
      return null;
    },
    save: () => { VW.forEach(k => data[k] = num(k)); },
  },
  { // 4b. Gabor-Granger
    html: () => `<h2>À quel prix l'achèteriez-vous ?</h2>
      ${offerHtml()}
      <p>Pour chaque prix, achèteriez-vous cette canette ?</p>
      ${GG_PRICES.map(p => `<div class="q"><span class="title">À ${fmt(p)}</span>
        ${radios(ggKey(p), GG_SCALE, "likert")}</div>`).join("")}`,
    check: () => GG_PRICES.every(p => val(ggKey(p))) ? null : "Merci de répondre pour chaque prix.",
    save: () => { GG_PRICES.forEach(p => data[ggKey(p)] = Number(val(ggKey(p)))); },
  },
  { // 5. Contrôle de la manipulation
    html: () => `<h2>Une question sur ce que vous avez vu</h2>
      ${likert("controle_limitee", "La boisson qui vous a été présentée est vendue en édition limitée.")}`,
    check: () => val("controle_limitee") ? null : "Merci de choisir une réponse.",
    save: () => { data.controle_limitee = Number(val("controle_limitee")); },
  },
  // 6. Perception (Likert), sur deux pages
  likertPage("Ce que vous en pensez (1/2)", LK_PAGE_1),
  likertPage("Ce que vous en pensez (2/2)", LK_PAGE_2),
];

// --- Moteur ---
let i = 0;
const app = document.getElementById("app");
function render() {
  document.getElementById("bar").style.width = (i / steps.length * 100) + "%";
  app.innerHTML = steps[i].html() + `<div class="error" id="err"></div><button id="next">Suivant</button>`;
  document.getElementById("next").onclick = next;
  window.scrollTo(0, 0);
}
function next() {
  const err = steps[i].check();
  if (err !== null) { document.getElementById("err").textContent = err; return; }
  const stop = steps[i].save();
  if (stop) { data.statut = stop; return finish(); }
  if (++i < steps.length) render(); else { data.statut = "complet"; finish(); }
}
function finish() {
  data.duree_sec = Math.round((Date.now() - start) / 1000);
  document.getElementById("bar").style.width = "100%";
  const msg = data.statut === "complet"
    ? "Vos réponses ont bien été enregistrées. Merci beaucoup pour votre participation !"
    : data.statut === "refus" ? "Pas de souci, merci d'avoir pris le temps d'ouvrir ce questionnaire."
    : "Merci ! Ce questionnaire est réservé aux personnes de 18 ans et plus, il s'arrête donc ici pour vous.";
  app.innerHTML = `<h1>Merci</h1><p>${msg}</p>`;
  if (ENDPOINT.startsWith("http")) {
    fetch(ENDPOINT, { method: "POST", mode: "no-cors", body: JSON.stringify(data) }).catch(() => {});
  } else {
    console.log("Pas d'ENDPOINT configuré, réponse non envoyée :", data);
  }
  try { sessionStorage.removeItem("version"); } catch (e) {}
}
render();
</script>
</body>
</html>
